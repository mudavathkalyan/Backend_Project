
name: Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Trivy Scan and STIX Conversion
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          skip-files: .env
          skip-dirs: node_modules
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install STIX dependencies
        run: python -m pip install -r requirements-security.txt

      - name: Process findings and generate STIX
        run: python scripts/process_trivy.py trivy-report.json

      - name: Upload security outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results-${{ github.run_id }}
          path: |
            trivy-report.json
            security-output/summary.json
            security-output/trivy-stix-2.1.json
          if-no-files-found: warn
          retention-days: 30
